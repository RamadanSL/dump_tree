name: Make Device Tree Clean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cpio aria2 wget python3-pip

      - name: Download Images
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?id=1BFML1FevkxGUDiI3I2ha6qCAvNOC-aO7" -O vendor_boot.img
          gdown "https://drive.google.com/uc?id=1fCdAJUbt8x2FJaGy1RwGJbn3jYkFEuXX" -O boot.img

      - name: Extract Images and Build Tree
        run: |
          # Скачиваем официальный бинарник magiskboot для разборки образов MTK
          wget https://github.com/HuskyDG/magiskboot/releases/download/v25.2/magiskboot -O magiskboot
          chmod +x magiskboot

          # Создаем структуру папки под Tecno Spark 30
          mkdir -p output/device/tecno/Spark30
          cd output/device/tecno/Spark30

          # Распаковываем vendor_boot.img (вытаскиваем kernel и ramdisk)
          ../../../../magiskboot unpack ../../../../vendor_boot.img
          mkdir -p vendor_ramdisk
          cd vendor_ramdisk
          cpio -i < ../ramdisk.cpio || true
          cd ..

          # Распаковываем boot.img
          mkdir -p boot_unpack
          cd boot_unpack
          ../../../../../magiskboot unpack ../../../../../boot.img
          mkdir -p boot_ramdisk
          cd boot_ramdisk
          cpio -i < ../ramdisk.cpio || true
          cd ../..

          # Создаем базовый BoardConfig.mk
          cat << 'EOF' > BoardConfig.mk
          DEVICE_PATH := device/tecno/Spark30

          # Architecture
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=
          TARGET_CPU_VARIANT := generic

          # Kernel
          BOARD_KERNEL_PAGESIZE := 4096
          BOARD_INCLUDE_RECOVERY_DTBO := true
          TARGET_NO_KERNEL := false
          BOARD_USES_VENDOR_BOOT := true

          # Partitions
          BOARD_FLASH_BLOCK_SIZE := 131072
          BOARD_HAS_LARGE_FILESYSTEM := true
          EOF

          # Создаем базовый Android.mk
          cat << 'EOF' > Android.mk
          LOCAL_PATH := $(call my-dir)
          ifeq ($(TARGET_DEVICE),Spark30)
          include $(call all-makefiles-under,$(LOCAL_PATH))
          endif
          EOF

          # Копируем ядро
          cp kernel ./kernel

      - name: Upload Device Tree Artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree
          path: output/
