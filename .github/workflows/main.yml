name: Make Device Tree Universal

on:
  workflow_dispatch:
    inputs:
      vendor_boot_url:
        description: 'Прямая ссылка на vendor_boot.img (Catbox/Pixeldrain)'
        required: true
        default: 'https://files.catbox.moe/xxxxxx.img'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y cpio aria2 wget python3-pip
          pip install --upgrade pip
          pip install twrpdtgen

      - name: Download Image
        run: |
          aria2c -s 16 -x 16 -o vendor_boot.img "${{ github.event.inputs.vendor_boot_url }}"

      - name: Generate Device Tree (Auto-bypass errors)
        run: |
          mkdir -p output
          # Запуск с авто-подстановкой свойств, если build.prop урезан
          python3 -m twrpdtgen vendor_boot.img -o output/ || true
          
          # Если twrpdtgen упал из-за build.prop, вытаскиваем конфиги напрямую
          if [ ! -d "output/tecno" ]; then
            echo "Fallback: Ручное извлечение ramdisk..."
            mkdir -p output/extracted
            python3 -m twrpdtgen.extract vendor_boot.img output/extracted || true
          fi

      - name: Upload Device Tree Artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree-ready
          path: output/
