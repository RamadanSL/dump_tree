name: Make Device Tree

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cpio
          pip install twrpdtgen gdown

      - name: Download Image from Google Drive
        run: |
          gdown --id 1BFML1FevkxGUDiI3I2ha6qCAvNOC-aO7 -O vendor_boot.img

      - name: Generate Device Tree
        run: |
          mkdir output
          python3 -m twrpdtgen vendor_boot.img -o output/

      - name: Upload Device Tree Artifact
        uses: actions/upload-artifact@v3
        with:
          name: device-tree
          path: output/
