name: Make Device Tree Clean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cpio aria2 wget python3-pip android-sdk-libsparse-utils android-tools-mkbootimg

      - name: Download Images
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?id=1BFML1FevkxGUDiI3I2ha6qCAvNOC-aO7" -O vendor_boot.img
          gdown "https://drive.google.com/uc?id=1fCdAJUbt8x2FJaGy1RwGJbn3jYkFEuXX" -O boot.img

      - name: Extract Images and Build Tree
        run: |
          mkdir -p output/device/tecno/Spark30
          WORKDIR=$(pwd)/output/device/tecno/Spark30

          # Распаковка vendor_boot через системный unpack_bootimg
          mkdir -p vendor_out
          unpack_bootimg --boot_img vendor_boot.img --out vendor_out

          # Распаковка boot через системный unpack_bootimg
          mkdir -p boot_out
          unpack_bootimg --boot_img boot.img --out boot_out

          # Распаковка ramdisk из vendor_boot
          mkdir -p $WORKDIR/ramdisk
          cd $WORKDIR/ramdisk
          if [ -f ../../../vendor_out/ramdisk ]; then
            lz4 -d ../../../vendor_out/ramdisk ramdisk.cpio || cp ../../../vendor_out/ramdisk ramdisk.cpio
            cpio -i < ramdisk.cpio || true
            rm -f ramdisk.cpio
          fi
          cd $WORKDIR

          # Перенос ядра
          if [ -f ../../../vendor_out/kernel ]; then
            cp ../../../vendor_out/kernel ./kernel
          elif [ -f ../../../boot_out/kernel ]; then
            cp ../../../boot_out/kernel ./kernel
          fi

          # Генерация BoardConfig.mk
          cat << 'EOF' > BoardConfig.mk
          DEVICE_PATH := device/tecno/Spark30

          # Architecture
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=
          TARGET_CPU_VARIANT := generic

          # Kernel
          BOARD_KERNEL_PAGESIZE := 4096
          BOARD_INCLUDE_RECOVERY_DTBO := true
          TARGET_NO_KERNEL := false
          BOARD_USES_VENDOR_BOOT := true

          # Partitions
          BOARD_FLASH_BLOCK_SIZE := 131072
          BOARD_HAS_LARGE_FILESYSTEM := true
          EOF

          # Генерация Android.mk
          cat << 'EOF' > Android.mk
          LOCAL_PATH := $(call my-dir)
          ifeq ($(TARGET_DEVICE),Spark30)
          include $(call all-makefiles-under,$(LOCAL_PATH))
          endif
          EOF

      - name: Upload Device Tree Artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree
          path: output/
