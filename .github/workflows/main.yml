name: Make Device Tree Clean

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cpio aria2 wget python3-pip

      - name: Download Images
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?id=1BFML1FevkxGUDiI3I2ha6qCAvNOC-aO7" -O vendor_boot.img
          gdown "https://drive.google.com/uc?id=1fCdAJUbt8x2FJaGy1RwGJbn3jYkFEuXX" -O boot.img

      - name: Extract Images and Build Tree
        run: |
          # Скачивание official magiskboot из релизов topjohnwu
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -j magisk.zip "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

          mkdir -p output/device/tecno/Spark30
          WORKDIR=$(pwd)/output/device/tecno/Spark30

          # Распаковка vendor_boot
          mkdir -p vendor_out
          cd vendor_out
          ../../magiskboot unpack ../vendor_boot.img
          cd ..

          # Распаковка boot
          mkdir -p boot_out
          cd boot_out
          ../../magiskboot unpack ../boot.img
          cd ..

          # Извлечение ядра
          if [ -f vendor_out/kernel ]; then
            cp vendor_out/kernel $WORKDIR/kernel
          elif [ -f boot_out/kernel ]; then
            cp boot_out/kernel $WORKDIR/kernel
          fi

          # Извлечение ramdisk
          mkdir -p $WORKDIR/ramdisk
          cd $WORKDIR/ramdisk
          if [ -f ../../../vendor_out/ramdisk.cpio ]; then
            cpio -i < ../../../vendor_out/ramdisk.cpio || true
          fi
          cd $WORKDIR

          # Конфиг BoardConfig.mk
          cat << 'EOF' > BoardConfig.mk
          DEVICE_PATH := device/tecno/Spark30

          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=
          TARGET_CPU_VARIANT := generic

          BOARD_KERNEL_PAGESIZE := 4096
          BOARD_INCLUDE_RECOVERY_DTBO := true
          TARGET_NO_KERNEL := false
          BOARD_USES_VENDOR_BOOT := true

          BOARD_FLASH_BLOCK_SIZE := 131072
          BOARD_HAS_LARGE_FILESYSTEM := true
          EOF

          # Конфиг Android.mk
          cat << 'EOF' > Android.mk
          LOCAL_PATH := $(call my-dir)
          ifeq ($(TARGET_DEVICE),Spark30)
          include $(call all-makefiles-under,$(LOCAL_PATH))
          endif
          EOF

      - name: Upload Device Tree Artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree
          path: output/
